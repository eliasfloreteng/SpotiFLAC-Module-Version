name: Sync with upstream

on:
  schedule:
    # Daily at 02:17 UTC (off the hour to avoid GitHub's cron rush)
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch --no-tags "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"

      - name: Merge upstream
        run: |
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          before=$(git rev-parse HEAD)

          # --no-ff so there is always a commit to rewrite below. Upstream is
          # often strictly ahead of us, and a fast-forward would adopt its
          # .github/workflows verbatim with nothing left to rewrite.
          merge_failed=0
          git merge --no-edit --no-ff FETCH_HEAD || merge_failed=1

          if [ "$merge_failed" = 1 ]; then
            # Conflicts under .github/workflows resolve themselves below.
            # Anything else turns the run red and is merged by hand.
            outside=$(git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/' || true)
            if [ -n "$outside" ]; then
              echo "::error::Conflict with upstream, resolve manually:"
              echo "$outside"
              exit 1
            fi
          fi

          # This fork keeps its own set of workflows (it drops upstream's PyPI
          # and GHCR publishing and adds this job), and GITHUB_TOKEN may not
          # push changes under .github/workflows at all, so upstream's copies
          # are always discarded.
          git rm -rqf --ignore-unmatch -- .github/workflows
          if git rev-parse -q --verify "$before:.github/workflows" >/dev/null; then
            git checkout "$before" -- .github/workflows
          fi

          if [ "$merge_failed" = 1 ]; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          git --no-pager diff --stat "$before" HEAD -- .github/workflows

      - name: Push
        run: git push origin "HEAD:$TARGET_BRANCH"
