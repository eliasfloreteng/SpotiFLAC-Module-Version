name: Sync with upstream

on:
  schedule:
    # Daily at 02:17 UTC (off the hour to avoid GitHub's cron rush)
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/BartolomeoRusso9/SpotiFLAC-Module-Version.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch --no-tags "$UPSTREAM_REPO" "$UPSTREAM_BRANCH"

      - name: Merge upstream
        run: |
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          before=$(git rev-parse HEAD)

          # --no-ff so the sync lands as our own merge commit: a fast-forward
          # would put an upstream commit at HEAD, and the workflow fixup below
          # would then rewrite it and break the next merge base.
          git merge --no-commit --no-ff FETCH_HEAD || true

          # .github/workflows is fork-owned: GITHUB_TOKEN cannot push workflow
          # changes at all, and upstream carries neither this file nor the fork's
          # removal of its PyPI/GHCR publish workflows. Keep our copies verbatim,
          # conflicts included. Upstream workflow changes must be ported by hand.
          git rm -r -q -f --ignore-unmatch .github/workflows
          git checkout "$before" -- .github/workflows

          # Any remaining conflict is real: leave it red and resolve it manually.
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Merge conflicts outside .github/workflows:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit --no-edit

      - name: Push
        run: git push origin "HEAD:$TARGET_BRANCH"
